[project]
name = "netra-backend"
version = "0.1.0"
description = "netra — SaaS multi-tenant face-recognition attendance platform (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.28",
    "insightface>=0.7.3",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "openpyxl>=3.1",
    "passlib[argon2]>=1.7.4",
    "pgvector>=0.3.6",
    "pillow>=10.4",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.13.4",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "reportlab>=4.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
]

[project.optional-dependencies]
# (recognition extras are now required — see main dependencies)

[dependency-groups]
dev = [
    "black>=24.10",
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]
# Ruff handles import sorting (rule "I") and linting; Black owns code formatting.
extend-exclude = "alembic/versions"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI uses function calls in argument defaults (Depends)
    "UP042",  # `str, Enum` is intentional: values must serialize as plain strings
              # for JSON/JWT/SQLAlchemy Enum storage; StrEnum changes str() semantics
    "UP046",  # Generic[T] base kept for readability over PEP 695 type params
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic migrations: keep verbatim, don't enforce line length.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
