services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: netra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netra}
      POSTGRES_DB: ${POSTGRES_DB:-netra}
    ports:
      - "5430:5432"
    volumes:
      - netra_pgdata:/var/lib/postgresql/data
      # Belt-and-suspenders: create the least-privilege netra_app role on a
      # fresh volume. Alembic migration b69335609137 is the source of truth.
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: netra-backend
    environment:
      # DB connection — app role (netra_app) for the running app.
      DATABASE_URL: postgresql+asyncpg://netra_app:netra_app@postgres:5432/${POSTGRES_DB:-netra}
      DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_USER:-netra}:${POSTGRES_PASSWORD:-netra}@postgres:5432/${POSTGRES_DB:-netra}
    volumes:
      # Bind-mount source tree: any edit on host is live in the container.
      - ./backend:/app
      # Persist .venv across container restarts so cold-start stays cheap.
      - backend_venv:/app/.venv
      # Persist ML models downloaded at runtime.
      - backend_models:/app/models
    ports:
      - "5170:5170"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  netra_pgdata:
  backend_venv:
  backend_models:
