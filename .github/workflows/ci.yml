name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint · type-check · migrate · test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: netra
          POSTGRES_PASSWORD: netra
          POSTGRES_DB: netra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Superuser URL — used by alembic migrations only (creates netra_app role)
      DATABASE_URL_SUPER: postgresql+asyncpg://netra:netra@localhost:5432/netra
      # App URL — used by pytest (netra_app role, RLS enforced)
      DATABASE_URL: postgresql+asyncpg://netra_app:netra_app@localhost:5432/netra
      SECRET_KEY: ci_only_secret_key_32_chars_long_xx
      # CI Postgres is an ephemeral throwaway service container, so allow the
      # test suite to TRUNCATE it. Local dev DBs are protected by the same guard.
      NETRA_ALLOW_TEST_DB_WIPE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (including dev)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Validate migration graph (no multiple heads)
        run: |
          HEADS=$(uv run alembic heads 2>&1)
          echo "$HEADS"
          HEAD_COUNT=$(echo "$HEADS" | grep -v '^\s*$' | wc -l | tr -d ' ')
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple Alembic heads detected — migration chain is broken."
            echo "Each migration must have exactly one parent via down_revision."
            echo "To fix: run 'alembic merge -m <name>' to consolidate heads, or"
            echo "correct down_revision in each migration file."
            exit 1
          fi
          echo "✓ Migration graph is valid: single head ($HEADS)"

      - name: Verify upgrade-to-head is idempotent (downgrade + upgrade)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_SUPER }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          echo "✓ Full downgrade + upgrade cycle succeeded"

      - name: Run tests (netra_app role)
        run: uv run pytest --cov=app --cov-report=term-missing

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build docs site
        working-directory: ui/docs-site
        run: |
          npm ci
          npm run docs:build
