# Pre-commit hooks (SETUP-4). Install once: `uv run pre-commit install`
# Run on all files: `uv run pre-commit run --all-files`
# Python tooling (ruff/black/mypy) is scoped to backend/ where pyproject.toml lives.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff (lint + import sort)
        args: [--fix]
        files: ^backend/.*\.py$

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/.*\.py$

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/.*\.py$
