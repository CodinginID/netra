server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable → cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker / manifest should not be cached aggressively.
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Baseline security headers for the whole app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The dashboard itself must NOT be framable.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── Embed pages (/embed/*) — meant to be iframed by client apps ──
    # Override the global X-Frame-Options and DO NOT block framing here. The
    # per-tenant `frame-ancestors` allowlist (embed plan §6.10) is enforced by
    # the outer reverse proxy (which can look up the token → tenant), or set a
    # fixed allowlist below if all clients share origins.
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Example (uncomment + set real origins, or do this dynamically at the proxy):
        # add_header Content-Security-Policy "frame-ancestors https://app-client.id" always;
        try_files $uri /index.html;
    }

    # SPA history fallback — every other route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
